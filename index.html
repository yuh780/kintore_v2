  app.querySelectorAll('[data-set-done]').forEach(el=>{
    bindCardKeepOpen(el);
    el.onclick=async()=>{
      const exId=el.getAttribute('data-ex-id');
      const draft=ensureDraft();
      const ex=draft.exercises.find(e=>e.id===exId);
      const idx=+el.getAttribute('data-set-idx');
      if(!ex) return;
      ex.sets[idx].done=!ex.sets[idx].done;
      syncExerciseDoneFromSets(ex,!ex.sets[idx].done);
      keepExerciseExpanded(exId);
      suppressCardCollapse();
      await persist(); render();
    };
  });

  app.querySelectorAll('[data-set-remove]').forEach(el=>{
    bindCardKeepOpen(el);
    el.onclick=async()=>{
      const exId=el.getAttribute('data-ex-id');
      const draft=ensureDraft();
      const ex=draft.exercises.find(e=>e.id===exId);
      const idx=+el.getAttribute('data-set-idx');
      if(!ex || ex.sets.length <= 1) return;
      if(!confirm(`セット${idx+1}を削除しますか？`)) return;
      ex.sets.splice(idx,1);
      syncExerciseDoneFromSets(ex);
      keepExerciseExpanded(exId);
      suppressCardCollapse();
      await persist(); render();
    };
  });

  app.querySelector('[data-action="save-workout"]')?.addEventListener('click',saveWorkout);

  app.querySelectorAll('[data-cal-nav]').forEach(el=>{
    el.onclick=()=>{
      let {year,month}=state.screen;
      month+=+el.getAttribute('data-cal-nav');
      if(month<0){month=11;year--;} if(month>11){month=0;year++;}
      state.screen.year=year; state.screen.month=month;
      render();
    };
  });
  app.querySelectorAll('[data-cal-date]').forEach(el=>{
    el.onclick=()=>{ openEditDate(el.getAttribute('data-cal-date')); };
  });
}

async function saveWorkout(){
  const draft=ensureDraft();
  if(!draft.exercises.length){ alert('種目を追加してください'); return; }
  syncDraftToHistory();
  state.draft=JSON.parse(JSON.stringify(draft));
  state.workDate=null;
  state.expandedExIds=[];
  await persist();
  openCalendarScreen();
  render();
}

function syncDraftToHistory(){
  const draft = state.draft;
  if(!draft?.date || !draft.exercises?.length) return;
  const entry = JSON.parse(JSON.stringify(draft));
  const idx = state.history.findIndex(h=>h.date===draft.date);
  if(idx>=0) state.history[idx]=entry;
  else state.history.push(entry);
}

async function persist(){
  syncDraftToHistory();
  await save(STORAGE.catalog,state.catalog);
  await save(STORAGE.circuits,state.circuits);
  await save(STORAGE.history,state.history);
  await save(STORAGE.draft,state.draft);
  await save(STORAGE.workDate,state.workDate);
}

async function init(){
  document.getElementById('app').innerHTML='<div class="empty-state">読み込み中…</div>';
  const [catalog,circuits,history,draft,workDate,menuRules,menuRulesText]=await Promise.all([
    load(STORAGE.catalog), load(STORAGE.circuits), load(STORAGE.history), load(STORAGE.draft), load(STORAGE.workDate), load(STORAGE.menuRules), load(STORAGE.menuRulesText)
  ]);
  state.catalog = mergeCatalogWithDefaults(catalog);
  state.circuits=circuits?.length ? circuits : DEFAULT_YOUTUBE_CIRCUITS;
  state.history=(history||[]).map(h=>({ ...h, exercises: (h.exercises||[]).map(normalizeExercise) }));
  state.draft=draft ? normalizeDraft(draft) : null;
  state.workDate=workDate||null;
  if(menuRules){
    state.menuRules = normalizeMenuRules(menuRules);
    state.menuRulesText = (typeof menuRulesText === 'string' && menuRulesText.trim())
      ? menuRulesText
      : rulesToSummaryText(state.menuRules);
  }else if(typeof menuRulesText === 'string' && menuRulesText.trim()){
    state.menuRulesText = menuRulesText;
    state.menuRules = parseRulesFromNaturalLanguage(menuRulesText);
  }else{
    state.menuRules = cloneMenuRules(DEFAULT_MENU_RULES);
    state.menuRulesText = DEFAULT_MENU_RULES_TEXT;
  }
  const n=new Date();
  state.screen={name:'calendar',year:n.getFullYear(),month:n.getMonth()};
  // カタログにデフォルト新種目を反映して保存
  await persist();
  try{const saved=localStorage.getItem('csv_import_v1');if(saved)ACTIVE_DATA=JSON.parse(saved);}catch(e){}
  render();
}

init();
</script>
